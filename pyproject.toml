[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorpeft"
version = "0.1.0"
description = "Parameter-efficient fine-tuning with tensor gradient-pursuit (rank-one CP) adapters"
readme = "README.md"
authors = [{ name = "Angshul Majumdar", email = "angshul@iiitd.ac.in" }]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "safetensors>=0.4",
    "huggingface_hub>=0.20",
]
keywords = ["peft", "fine-tuning", "lora", "tensor", "transformers", "huggingface"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest", "accelerate"]

[tool.setuptools.packages.find]
where = ["src"]
